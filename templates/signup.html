<!DOCTYPE html>
<html>

<head>

    <title>Signup</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:12px;
            width:350px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            background:#007BFF;
            color:white;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        p{
            text-align:center;
            margin-top:20px;
        }

        a{
            text-decoration:none;
            color:#007BFF;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Create Account</h2>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Signup
            </button>

        </form>

        <p>
            Already have account?
            <a href="/login">Login</a>
        </p>

    </div>

</body>

</html>
