<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:12px;
            width:350px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            background:#28a745;
            color:white;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1f7a34;
        }

        p{
            text-align:center;
            margin-top:20px;
        }

        a{
            text-decoration:none;
            color:#007BFF;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Recruiter Login</h2>

        <form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Enter Username"
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Enter Password"
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>


        <p>
            New recruiter?
            <a href="/signup">Create Account</a>
        </p>

    </div>

</body>

</html>
