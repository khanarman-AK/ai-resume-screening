<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecruitIQ — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #060818;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient mesh background */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .bg-gradient {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(99,102,241,0.35) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(16,185,129,0.2) 0%, transparent 55%),
                radial-gradient(ellipse 70% 60% at 60% 30%, rgba(139,92,246,0.2) 0%, transparent 55%),
                #060818;
            animation: bgShift 10s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0%   { filter: hue-rotate(0deg) brightness(1); }
            100% { filter: hue-rotate(15deg) brightness(1.1); }
        }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: float linear infinite;
            opacity: 0;
        }

        .orb-1 {
            width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(99,102,241,0.5), transparent 70%);
            top: -100px; left: -80px;
            animation: floatA 18s ease-in-out infinite;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(16,185,129,0.4), transparent 70%);
            bottom: -60px; right: -60px;
            animation: floatB 14s ease-in-out infinite;
        }
        .orb-3 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%);
            top: 40%; left: 55%;
            animation: floatC 20s ease-in-out infinite;
        }

        @keyframes floatA {
            0%,100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            33%      { transform: translate(60px, 80px) scale(1.1); opacity: 1; }
            66%      { transform: translate(-30px, 50px) scale(0.95); opacity: 0.7; }
        }
        @keyframes floatB {
            0%,100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
            50%      { transform: translate(-50px, -40px) scale(1.15); opacity: 0.9; }
        }
        @keyframes floatC {
            0%,100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            40%      { transform: translate(30px, -60px) scale(1.2); opacity: 0.8; }
            70%      { transform: translate(-20px, 30px) scale(0.9); opacity: 0.4; }
        }

        /* Grid overlay */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Main card */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            margin: 20px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 48px 44px;
            box-shadow:
                0 0 0 1px rgba(99,102,241,0.15),
                0 24px 80px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.08);
            animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(32px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 16px rgba(99,102,241,0.5);
        }

        .logo-name {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.4px;
        }

        .logo-name span { color: #818cf8; }

        /* Heading */
        .card-title {
            font-size: 30px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: -0.6px;
            margin-bottom: 6px;
            line-height: 1.15;
        }

        .card-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        /* Error */
        .error-box {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form */
        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            pointer-events: none;
            opacity: 0.5;
        }

        input {
            width: 100%;
            padding: 13px 15px 13px 44px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', system-ui, sans-serif;
            color: #f1f5f9;
            transition: all 0.2s;
            outline: none;
        }

        input::placeholder { color: #475569; }

        input:focus {
            background: rgba(99,102,241,0.08);
            border-color: rgba(99,102,241,0.6);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', system-ui, sans-serif;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(99,102,241,0.45);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99,102,241,0.55);
        }

        .btn:active { transform: translateY(0); box-shadow: 0 2px 10px rgba(99,102,241,0.4); }

        /* Divider */
        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 24px 0;
        }

        .divider hr {
            flex: 1; border: none;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .divider span { font-size: 12px; color: #475569; }

        /* Footer */
        .card-footer {
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .card-footer a {
            color: #818cf8;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .card-footer a:hover { color: #a5b4fc; text-decoration: underline; }

        /* Feature pills */
        .features {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #94a3b8;
            font-size: 11.5px;
            font-weight: 500;
            padding: 5px 11px;
            border-radius: 100px;
        }

        .pill-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="bg">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="card">

    <div class="logo">
        <div class="logo-icon">🎯</div>
        <span class="logo-name">Recruit<span>IQ</span></span>
    </div>

    <div class="features">
        <span class="pill"><span class="pill-dot" style="background:#34d399"></span>AI Screening</span>
        <span class="pill"><span class="pill-dot" style="background:#818cf8"></span>ATS Scoring</span>
        <span class="pill"><span class="pill-dot" style="background:#f59e0b"></span>PDF Reports</span>
    </div>

    <h1 class="card-title">Welcome back</h1>
    <p class="card-subtitle">Sign in to your recruiter dashboard</p>

    {% if error %}
    <div class="error-box">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
                <span class="input-icon">🔒</span>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>
        </div>

        <button type="submit" class="btn">Sign In →</button>
    </form>

    <div class="divider"><hr><span>or</span><hr></div>

    <p class="card-footer">
        New to RecruitIQ? <a href="/signup">Create a free account</a>
    </p>

</div>

</body>
</html>
