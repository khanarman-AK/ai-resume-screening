<!DOCTYPE html>
<html>
<head>

    <title>AI Resume Screening System</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            padding:40px;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#007BFF;
            margin-bottom:30px;
        }

        textarea{
            width:100%;
            height:180px;
            padding:10px;
            margin-top:10px;
            border-radius:5px;
            border:1px solid #ccc;
        }

        input[type="file"]{
            margin-top:20px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:25px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🤖 AI Resume Screening System</h1>

    <<form method="POST" enctype="multipart/form-data">

    <textarea
        name="job_description"
        placeholder="Enter Job Description"
    ></textarea>

    <input
        type="file"
        name="resumes"
        multiple
    >

    <button type="submit">
        Analyze Resumes
    </button>

</form>

</div>

</body>
<div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#007BFF;
    color:white;
    padding:15px 30px;
">

    <h3>
        Welcome, {{ session.user }}
    </h3>

    <a href="/logout" style="
        color:white;
        text-decoration:none;
        font-weight:bold;
    ">
        Logout
    </a>

</div>
</html>
