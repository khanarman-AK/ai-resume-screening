<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Screener</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
        }

        button {
            background: #007BFF;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>AI Resume Screener</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="resumes" multiple required>

        <textarea name="job_desc" placeholder="Paste Job Description..." rows="6"></textarea>

        <button type="submit">Analyze Resume</button>
    </form>
</div>

</body>
</html>
